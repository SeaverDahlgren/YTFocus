<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YTFocus</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <p class="popup-kicker">Focus mode</p>
      <h1>Sites</h1>
      <label class="toggle">
        <span>YouTube</span>
        <input id="youtubeEnabled" type="checkbox">
      </label>
      <label class="toggle">
        <span>Instagram</span>
        <input id="instagramEnabled" type="checkbox">
      </label>
    </main>
    <script src="shared-config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
